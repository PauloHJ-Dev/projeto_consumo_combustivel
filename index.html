<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasolina|Etanol</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>CONSUMO DE COMBUSTÍVEL</h1>
    <div class="container">
        <form action="" id="formulario">
            <label for="combustivel">KM/L</label>

            <input type="number" name="etanol" id="etanol" placeholder="km" step="0.01">

            <input type="number" name="gasolina" id="gasolina" placeholder="litros" step="0.01">

            <input type="button" value="CALCULAR" onclick="calcular()">
            <input type="button" value="LIMPAR" onclick="limpar()">
        </form>
        <img src="imgs/tanque.png" class="ruim" alt="ruim" id="status">
        <p id="mensagem">Resultado:</p> 
    </div>
    <script src="js/script.js"></script>
</body>
</html>
